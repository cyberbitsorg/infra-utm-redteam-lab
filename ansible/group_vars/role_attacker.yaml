---
# The attacker runs Kali. Which tools to install is chosen by ATTACKER_TOOLSET
# in lab.conf (passed in by scripts/up.sh as -e attacker_toolset=...).
#   curated  -> attacker_packages_curated (fast headless subset)
#   headless -> the full kali-linux-headless metapackage
#   large    -> the broader kali-linux-large metapackage
attacker_toolset: curated

attacker_packages_curated:
  - nmap
  - netcat-traditional
  - gobuster
  - ffuf
  - hydra
  - sqlmap
  - metasploit-framework
attacker_packages_headless:
  - kali-linux-headless
attacker_packages_large:
  - kali-linux-large

attacker_packages: >-
  {{ attacker_packages_curated if attacker_toolset == 'curated'
     else attacker_packages_headless if attacker_toolset == 'headless'
     else attacker_packages_large }}

# Optional XFCE desktop, rendered in UTM's own window. Set ATTACKER_GUI=xfce in
# lab.conf to enable; 'none' (default) installs no desktop. scripts/up.sh passes
# the lab.conf value in as -e attacker_gui, which overrides this default.
attacker_gui: none

# Console/GUI password for the lab user on the attacker box. Set ATTACKER_PASSWORD
# in lab.conf; scripts/up.sh passes it in as -e attacker_password, which overrides
# this default. The attacker role sets it and removes the image's console/GUI
# auto-login so a login prompt is shown. SSH stays key-only regardless.
attacker_password: redteam
