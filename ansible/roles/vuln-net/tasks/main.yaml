---
- name: Install intentionally-vulnerable services
  ansible.builtin.apt:
    name:
      - openssh-server
      - vsftpd
      - samba
      - apache2
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the weak-credential user
  ansible.builtin.user:
    name: "{{ weak_user }}"
    shell: /bin/bash
    create_home: true

- name: Set the weak password (lab-only)
  # Set on the guest so we do not depend on the control node's crypt/passlib.
  ansible.builtin.shell:
    cmd: "echo '{{ weak_user }}:{{ weak_password }}' | chpasswd"
  changed_when: false

- name: Enable SSH password auth (deliberately weak; must override cloud-init)
  # Sorts before cloud-init's 50-cloud-init.conf, and sshd honours the first
  # match, so this "yes" wins over cloud-init's "no".
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-lab-weak.conf
    content: "PasswordAuthentication yes\n"
    owner: root
    group: root
    mode: "0644"
  notify: restart ssh

- name: Enable anonymous FTP (vsftpd)
  ansible.builtin.copy:
    dest: /etc/vsftpd.conf
    content: |
      listen=YES
      listen_ipv6=NO
      anonymous_enable=YES
      local_enable=YES
      write_enable=NO
      dirmessage_enable=YES
      use_localtime=YES
      xferlog_enable=YES
      secure_chroot_dir=/var/run/vsftpd/empty
      pam_service_name=vsftpd
    owner: root
    group: root
    mode: "0644"
  notify: restart vsftpd

- name: Create an open Samba share directory
  ansible.builtin.file:
    path: "{{ samba_share_path }}"
    state: directory
    mode: "0777"

- name: Configure an open (guest) Samba share
  ansible.builtin.blockinfile:
    path: /etc/samba/smb.conf
    marker: "# {mark} REDTEAM LAB SHARE"
    block: |
      [public]
        path = {{ samba_share_path }}
        browsable = yes
        read only = no
        guest ok = yes
        force user = nobody
  notify: restart samba

- name: Create the secondary account reachable with the leaked key
  ansible.builtin.user:
    name: "{{ backup_user }}"
    shell: /bin/bash
    create_home: true

- name: Create the directory that "leaks" the backup key
  ansible.builtin.file:
    path: "{{ leaked_key_path | dirname }}"
    state: directory
    owner: "{{ weak_user }}"
    group: "{{ weak_user }}"
    mode: "0755"

- name: Generate the leaked SSH keypair on the guest (idempotent)
  # Generated on the guest so no private key material ever lands in the repo.
  ansible.builtin.command:
    argv:
      - ssh-keygen
      - -t
      - ed25519
      - -N
      - ""
      - -f
      - "{{ leaked_key_path }}"
      - -C
      - lab-leaked-key
    creates: "{{ leaked_key_path }}"

- name: Make the leaked private key world-readable
  ansible.builtin.file:
    path: "{{ leaked_key_path }}"
    mode: "0644"

- name: Authorise the leaked key for the secondary account
  # ansible.builtin.user does not create ~/.ssh, and copy refuses missing dirs.
  ansible.builtin.file:
    path: "/home/{{ backup_user }}/.ssh"
    state: directory
    owner: "{{ backup_user }}"
    group: "{{ backup_user }}"
    mode: "0700"

- name: Install the leaked key as the secondary account's authorised key
  ansible.builtin.copy:
    src: "{{ leaked_key_path }}.pub"
    remote_src: true
    dest: "/home/{{ backup_user }}/.ssh/authorized_keys"
    owner: "{{ backup_user }}"
    group: "{{ backup_user }}"
    mode: "0600"

- name: Grant the weak user passwordless sudo on a GTFOBins binary
  # Classic privesc misconfiguration: any shell escape in this binary is root.
  ansible.builtin.copy:
    dest: /etc/sudoers.d/lab-weak
    content: "{{ weak_user }} ALL=(ALL) NOPASSWD: {{ privesc_tool }}\n"
    owner: root
    group: root
    mode: "0440"
    validate: "/usr/sbin/visudo -cf %s"

- name: Create the leaked backup directory in the web root
  ansible.builtin.file:
    path: "{{ web_secret_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Plant a world-readable secret in the web root
  ansible.builtin.copy:
    dest: "{{ web_secret_path }}"
    content: |
      # legacy backup, TODO remove before production
      db_user: {{ backup_user }}
      db_password: {{ web_secret_password }}
    owner: root
    group: root
    mode: "0644"

- name: Ensure the weak services run at boot
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - ssh
    - vsftpd
    - smbd
    - apache2
