---
- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Install common packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Deploy lab MOTD
  ansible.builtin.copy:
    dest: /etc/motd
    mode: "0644"
    content: |+

      ════════════════════════════════════════
        redteam lab · {{ inventory_hostname }} · {{ lab_ip | default('n/a') }}
        Authorised, isolated lab use only.
      ════════════════════════════════════════


