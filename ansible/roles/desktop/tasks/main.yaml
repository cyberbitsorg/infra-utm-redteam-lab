---
# Optional XFCE desktop for the attacker, rendered in UTM's own window via the
# virtio-gpu console the attacker role already configures. Enabled by
# ATTACKER_GUI=xfce in lab.conf (passed in as -e attacker_gui). This role runs
# AFTER the attacker role, so the machine is already on the standard console
# kernel and LightDM can start straight away, no extra reboot needed.

- name: Preseed LightDM as the default display manager
  # kali-desktop-xfce can offer a choice of display manager; pin LightDM up front
  # so the non-interactive apt install never falls back to another one, which
  # would leave our autologin drop-in unused.
  ansible.builtin.debconf:
    name: lightdm
    question: shared/default-x-display-manager
    vtype: select
    value: lightdm

- name: Install the XFCE desktop and LightDM
  ansible.builtin.apt:
    name:
      - kali-desktop-xfce
      - lightdm
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Remove any LightDM auto-login drop-in
  # The lab prompts for the ATTACKER_PASSWORD at the greeter instead of auto-
  # logging in. Earlier builds shipped this drop-in; delete it so LightDM shows
  # its greeter. Idempotent: a no-op once the file is gone.
  ansible.builtin.file:
    path: /etc/lightdm/lightdm.conf.d/10-lab-autologin.conf
    state: absent

- name: Remove the lab user from the passwordless-login groups
  # Membership in nopasswdlogin lets the greeter admit the user without a
  # password, which would defeat the login prompt. gpasswd -d only where the
  # group exists and the user is a member, so this stays idempotent.
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      for g in nopasswdlogin autologin; do
        if getent group "$g" >/dev/null && id -nG "{{ ansible_user }}" | tr ' ' '\n' | grep -qx "$g"; then
          gpasswd -d "{{ ansible_user }}" "$g"
        fi
      done
    executable: /bin/bash
  register: desktop_group_removal
  changed_when: "'Removing user' in desktop_group_removal.stdout"

- name: Read the current default systemd target
  ansible.builtin.command: systemctl get-default
  register: desktop_current_target
  changed_when: false

- name: Boot to the graphical target by default
  ansible.builtin.command: systemctl set-default graphical.target
  when: desktop_current_target.stdout != 'graphical.target'

- name: Enable and start LightDM
  ansible.builtin.systemd:
    name: lightdm
    enabled: true
    state: started
