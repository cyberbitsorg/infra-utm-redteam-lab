---
- name: Install the selected Kali toolset
  ansible.builtin.apt:
    name: "{{ attacker_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install MQTT clients (needed for the vuln-iot target)
  # Outside attacker_packages: the headless/large metapackages replace the
  # curated list wholesale, and neither includes mosquitto-clients.
  ansible.builtin.apt:
    name: mosquitto-clients
    state: present

- name: Ensure SecLists wordlists are present
  ansible.builtin.apt:
    name: seclists
    state: present
  # seclists is a Kali package; it installs the wordlists under /usr/share/seclists.

- name: Record known lab targets in /etc/hosts
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} REDTEAM LAB TARGETS"
    block: |
      {% for host in groups['all'] %}
      {{ hostvars[host].lab_ip }} {{ hostvars[host].vm_name }}
      {% endfor %}

# The genericcloud cloud kernel omits virtio_gpu, so UTM's display stays
# blank. Install the standard Kali kernel and pin grub to it. IMPORTANT: never
# purge the cloud kernel (purging wedged the boot); only grub's default
# changes. SSH drives the lab regardless.
- name: Install the standard Kali kernel (includes virtio_gpu for the console)
  ansible.builtin.apt:
    name: linux-image-arm64
    state: present
  when: ansible_distribution == 'Kali'

- name: Make grub default to the standard (non-cloud) kernel
  # Pin real menuentry ids from grub.cfg (no guessing): grub sorts the cloud
  # flavour first at equal version, so without GRUB_DEFAULT=saved it would boot
  # the driver-less kernel.
  ansible.builtin.shell: |
    set -euo pipefail
    update-grub
    sub="$(awk -F"'" '/^submenu / {print $4; exit}' /boot/grub/grub.cfg)"
    entry="$(awk -F"'" '/[[:space:]]menuentry / && /gnulinux/ && /kali-arm64/ && !/cloud/ && !/recovery/ {print $4; exit}' /boot/grub/grub.cfg)"
    [ -n "$entry" ] || { echo "no standard-kernel grub entry found"; exit 1; }
    if ! grep -q '^GRUB_DEFAULT=saved' /etc/default/grub; then
      sed -i 's/^GRUB_DEFAULT=.*/GRUB_DEFAULT=saved/' /etc/default/grub
      grep -q '^GRUB_DEFAULT=' /etc/default/grub || echo 'GRUB_DEFAULT=saved' >> /etc/default/grub
    fi
    update-grub
    if [ -n "$sub" ]; then grub-set-default "${sub}>${entry}"; else grub-set-default "${entry}"; fi
  args:
    executable: /bin/bash
  changed_when: false
  when: ansible_distribution == 'Kali'

- name: Reboot into the standard kernel to activate the UTM console
  ansible.builtin.reboot:
    reboot_timeout: 300
  when:
    - ansible_distribution == 'Kali'
    - "'cloud' in ansible_kernel"

- name: Set the lab user's console/GUI password
  # Set on the guest so we do not depend on the control node's crypt/passlib,
  # matching the vuln-net role. chpasswd also unlocks the account that cloud-init
  # locked (lock_passwd: true), so the login prompt below is actually usable.
  # This is the console/GUI password only; SSH stays key-only (ssh_pwauth: false).
  ansible.builtin.shell:
    cmd: "echo '{{ ansible_user }}:{{ attacker_password }}' | chpasswd"
  changed_when: false

- name: Remove the Kali image's console auto-login overrides
  # The genericcloud image ships agetty drop-ins that auto-login root on tty1 and
  # the serial console. Remove them so the console presents a login prompt. They
  # are not owned by any dpkg package, so removal is permanent (apt won't undo it).
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/getty@tty1.service.d/autologin.conf
    - /etc/systemd/system/serial-getty@.service.d/autologin.conf
  notify: Reload systemd and restart the tty1 getty

# Metasploit ships with the toolset, but its database is not set up on first
# boot: a fresh msfconsole reports "postgresql selected, no connection" and
# db_nmap fails. Kali's system-wide msfdb must run as root (this play already
# does) and writes a config every user's msfconsole reads, so the lab user comes
# up connected. Guarded on the binary so stripping metasploit from the toolset
# does not break the play.
- name: Check for the Metasploit database helper
  ansible.builtin.stat:
    path: /usr/bin/msfdb
  register: attacker_msfdb

- name: Initialise the Metasploit database
  # creates: the exact config path msfdb writes, so this is a no-op once set up.
  ansible.builtin.command: msfdb init
  args:
    creates: /usr/share/metasploit-framework/config/database.yml
  when: attacker_msfdb.stat.exists

- name: Keep PostgreSQL running across reboots (Metasploit backend)
  ansible.builtin.service:
    name: postgresql
    enabled: true
    state: started
  when: attacker_msfdb.stat.exists
