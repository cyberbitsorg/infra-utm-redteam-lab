---
- name: Install the selected Kali toolset
  ansible.builtin.apt:
    name: "{{ attacker_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure SecLists wordlists are present
  ansible.builtin.apt:
    name: seclists
    state: present
  # seclists is a Kali package; it installs the wordlists under /usr/share/seclists.

- name: Record known lab targets in /etc/hosts
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} REDTEAM LAB TARGETS"
    block: |
      {% for host in groups['all'] %}
      {{ hostvars[host].lab_ip }} {{ hostvars[host].vm_name }}
      {% endfor %}

# The Kali "genericcloud" image runs a minimal cloud kernel that omits the
# virtio_gpu / DRM framebuffer driver, so UTM's display stays blank ("Display
# output is not active"). Install the standard Kali kernel (which has virtio_gpu)
# and make grub boot it by default. IMPORTANT: leave the cloud kernel installed
# as a fallback — do NOT purge it. Purging it wedged the boot (grub picked a
# half-removed entry and the guest hung). We only change grub's default. The lab
# is still driven over SSH; this is only so you can eyeball the attacker.
- name: Install the standard Kali kernel (includes virtio_gpu for the console)
  ansible.builtin.apt:
    name: linux-image-arm64
    state: present
  when: ansible_distribution == 'Kali'

- name: Make grub default to the standard (non-cloud) kernel
  # Read the real menuentry ids from the generated grub.cfg rather than guessing
  # a version/UUID, and pin them via GRUB_DEFAULT=saved. grub sorts the "cloud"
  # flavour ahead of the plain one at the same version, so without this it would
  # boot the driver-less cloud kernel.
  ansible.builtin.shell: |
    set -euo pipefail
    update-grub
    sub="$(awk -F"'" '/^submenu / {print $4; exit}' /boot/grub/grub.cfg)"
    entry="$(awk -F"'" '/[[:space:]]menuentry / && /gnulinux/ && /kali-arm64/ && !/cloud/ && !/recovery/ {print $4; exit}' /boot/grub/grub.cfg)"
    [ -n "$entry" ] || { echo "no standard-kernel grub entry found"; exit 1; }
    if ! grep -q '^GRUB_DEFAULT=saved' /etc/default/grub; then
      sed -i 's/^GRUB_DEFAULT=.*/GRUB_DEFAULT=saved/' /etc/default/grub
      grep -q '^GRUB_DEFAULT=' /etc/default/grub || echo 'GRUB_DEFAULT=saved' >> /etc/default/grub
    fi
    update-grub
    if [ -n "$sub" ]; then grub-set-default "${sub}>${entry}"; else grub-set-default "${entry}"; fi
  args:
    executable: /bin/bash
  changed_when: false
  when: ansible_distribution == 'Kali'

- name: Reboot into the standard kernel to activate the UTM console
  ansible.builtin.reboot:
    reboot_timeout: 300
  when:
    - ansible_distribution == 'Kali'
    - "'cloud' in ansible_kernel"
