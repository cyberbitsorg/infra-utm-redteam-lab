---
# Configures the lab after provisioning. Idempotent: safe to re-run.
# Run subsets with tags, e.g. --tags attacker or --tags vuln-web.

- name: Base configuration for all lab hosts
  hosts: all
  become: true
  gather_facts: true
  roles:
    - role: common
      tags: [common, base]

- name: Configure attacker box
  hosts: role_attacker
  become: true
  roles:
    - role: attacker
      tags: [attacker]
    - role: desktop
      when: attacker_gui | default('none') != 'none'
      tags: [gui, desktop]

- name: Configure vulnerable web target
  hosts: role_vuln_web
  become: true
  roles:
    - role: vuln-web
      tags: [vuln-web, apps]

- name: Configure vulnerable services target
  hosts: role_vuln_net
  become: true
  roles:
    - role: vuln-net
      tags: [vuln-net, apps]
