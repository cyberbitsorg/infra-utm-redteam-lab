#cloud-config
# Base bootstrap for every lab VM. Placeholders (@@...@@) are filled in by
# scripts/make-seed.sh. Role-specific software is installed by Ansible, not here,
# so a single bootstrap keeps all VMs identical at first boot.

hostname: "@@HOSTNAME@@"
preserve_hostname: false

users:
  - name: "@@LAB_USER@@"
    # no_user_group: useradd must not try to create a group named after the
    # user; a LAB_USER matching a legacy Debian/Kali system group (operator,
    # staff, ...) would exit 9, leaving the user and SSH key uncreated.
    no_user_group: true
    groups: [sudo]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    lock_passwd: true
    ssh_authorized_keys:
      - "@@SSH_KEY@@"

ssh_pwauth: false
disable_root: true

write_files:
  # Unattended-upgrades can restart sshd into an orphaned state that blocks
  # new SSH connections. Ansible manages packages here, so disable the timers.
  - path: /etc/apt/apt.conf.d/99lab-no-periodic
    content: |
      APT::Periodic::Update-Package-Lists "0";
      APT::Periodic::Download-Upgradeable-Packages "0";
      APT::Periodic::Unattended-Upgrade "0";
      APT::Periodic::AutocleanInterval "0";

package_update: true
packages:
  - python3
  - qemu-guest-agent

runcmd:
  - [systemctl, enable, --now, qemu-guest-agent]
  # Pre-create Ansible's root remote_tmp (all plays run become: true) to avoid
  # the first-module "remote_tmp did not exist" warning.
  - [install, -d, -m, "0700", -o, root, -g, root, /root/.ansible/tmp]

# Grow the root filesystem to fill the resized virtual disk.
growpart:
  mode: auto
  devices: ["/"]
resize_rootfs: true
